name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in pinned Bats container
        run: CONTAINER_ENGINE=docker ./tests/run.sh

  macos-shell-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stock macOS Bash compatibility
        run: |
          for file in bin/* hooks/*.sh tests/run.sh tests/fakes/herdr tests/test_helper/common.bash; do
            [ -f "$file" ] || continue
            case "$file" in *.py) continue ;; esac
            bash -n "$file"
          done
