name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in pinned Bats container
        run: CONTAINER_ENGINE=docker ./tests/run.sh

  macos-shell-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stock macOS Bash compatibility
        run: |
          for file in bin/* hooks/*.sh tests/run.sh tests/fakes/herdr tests/test_helper/common.bash; do
            [ -f "$file" ] || continue
            case "$file" in *.py) continue ;; esac
            bash -n "$file"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Exercise migrations, daemon lifecycle, status, and rollback on Python 3.9
        env:
          ROZORO_REQUIRE_PYTHON_39: '1'
        run: python3 tests/monitor-python-runtime.py
      - name: Exercise the supported Homebrew Python
        run: /opt/homebrew/bin/python3 tests/monitor-python-runtime.py
